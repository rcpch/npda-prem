{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" {% if LANGUAGE_CODE == "ur" %}dir="rtl"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NPDA PREM{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{% static 'nhsuk/nhsuk-frontend.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/rcpch.css' %}">
</head>
<body>
  <script>document.body.className = ((document.body.className) ? document.body.className + ' js-enabled' : 'js-enabled');</script>

  <a class="nhsuk-skip-link" href="#maincontent">Skip to main content</a>

  <header class="nhsuk-header" role="banner" data-module="nhsuk-header">
    <div class="nhsuk-width-container nhsuk-header__container">
      <div class="nhsuk-header__service">
        <a class="nhsuk-header__service-logo" href="/" aria-label="NPDA PREM homepage">
          <img src="{% static 'images/npda-logo.png' %}" alt="NPDA" height="40" style="vertical-align: middle; {% if LANGUAGE_CODE == 'ur' %}margin-left: 8px;{% else %}margin-right: 8px;{% endif %}">
          <span class="nhsuk-header__service-name">RCPCH &mdash; NPDA PREM</span>
        </a>
      </div>
    </div>
  </header>

  <div class="nhsuk-width-container">
    <main class="nhsuk-main-wrapper" id="maincontent" role="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <footer class="nhsuk-footer" role="contentinfo">
    <div class="nhsuk-width-container">
      <div class="nhsuk-footer__meta">
        <p class="nhsuk-body-s">&copy; Royal College of Paediatrics and Child Health</p>
      </div>
    </div>
  </footer>

  <script src="{% static 'nhsuk/nhsuk-frontend.min.js' %}"></script>
  <script>
    window.NHSUKFrontend && window.NHSUKFrontend.initAll();
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</body>
</html>
