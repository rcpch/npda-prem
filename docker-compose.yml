services:
  django:
    build: .
    image: npda-prem:built
    depends_on:
      - postgres
    volumes:
      - .:/app/
    env_file:
      - .env # env file - NOT committed to Git
    command: s/start-dev
    ports:
      - "8000:8000"
    restart: always

  postgres:
    image: postgres:18.1
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - .env # env file - NOT committed to Git
    restart: always

volumes:
  postgres-data: