{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="nhsuk-back-link">
  <a class="nhsuk-back-link__link" href="{% url 'landing' %}">
    <svg class="nhsuk-icon nhsuk-icon__chevron-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" height="24" width="24">
      <path d="M8.5 12c0-.3.1-.5.3-.7l5-5c.4-.4 1-.4 1.4 0s.4 1 0 1.4L10.9 12l4.3 4.3c.4.4.4 1 0 1.4s-1 .4-1.4 0l-5-5c-.2-.2-.3-.4-.3-.7z"></path>
    </svg>
    {% trans "Go back" %}
  </a>
</div>

<h1>{% trans "Who is completing this survey?" %}</h1>

<div class="nhsuk-form-group">
  <fieldset class="nhsuk-fieldset">
    <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--m">
      {% trans "Please select one of the following" %}
    </legend>
    <div class="nhsuk-radios">
      <div class="nhsuk-radios__item">
        <input class="nhsuk-radios__input" id="role-parent" name="role" type="radio" value="parent">
        <label class="nhsuk-label nhsuk-radios__label" for="role-parent">
          {% trans "I'm a parent" %}
        </label>
      </div>
      <div class="nhsuk-radios__item">
        <input class="nhsuk-radios__input" id="role-child" name="role" type="radio" value="child">
        <label class="nhsuk-label nhsuk-radios__label" for="role-child">
          {% trans "I'm a child" %}
        </label>
      </div>
    </div>
  </fieldset>
</div>

<a class="nhsuk-button" id="continue-btn" href="#" data-module="nhsuk-button">
  {% trans "Continue" %}
</a>

<script>
  (function() {
    var radios = document.querySelectorAll('input[name="role"]');
    var button = document.getElementById('continue-btn');
    var lang = new URLSearchParams(window.location.search).get('lang') || 'en';

    radios.forEach(function(radio) {
      radio.addEventListener('change', function() {
        var url = this.value === 'parent' ? '{% url "parent_form" %}' : '{% url "child_form" %}';
        button.href = url + '?lang=' + encodeURIComponent(lang);
      });
    });
  })();
</script>
{% endblock %}
