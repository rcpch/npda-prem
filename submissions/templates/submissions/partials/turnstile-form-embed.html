{% if turnstile_site_key and not not_a_bot %}
  <div
    class="cf-turnstile"
    data-sitekey="{{ turnstile_site_key }}"
    data-theme="light"
    data-appearance="interaction-only"
    data-language="{{ lang }}"
    ></div>
{% elif not_a_bot %}
  <!-- Session passed turnstile -->
{% else %}
  <!-- Turnstile not enabled -->
{% endif %}
